<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The board game store</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>  
    <header>
        <h1>Welcome to My Board Game Store</h1>
        <input
        type="search"
        id="search"
        class="search"
        placeholder="Search for a game..."
        aria-label="Search for a game">
        <nav class="header-nav">
            <a href="cart.html">Cart</a>
            <a href="login.html" id="auth-link">Login</a>
        </nav>
    </header>
    <main>
    <section id="products">
        <h2>Our Games</h2>
        <section id="product-grid" class="product-grid">
            <p class="loading-message">Loading games...</p>
        </section>
    </section>
    </main>
    <footer class="site-footer">
        <p>&copy; 2026 The Board Game Store</p>
    </footer>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>   
</body> 
</html>
